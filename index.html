<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corte — Estúdio de produção</title><link rel="stylesheet" href="/estilo.css"></head><body>
<header><div class="brand"><span class="mark" aria-hidden="true">◩</span> Corte<span class="sub">Estúdio de produção</span></div><nav aria-label="Principal"><button data-view="produce">Produzir</button><button data-view="channels">Canais</button><button data-view="history">Histórico</button><button data-view="settings">Configurações</button></nav></header>
<main><div role="status" id="notice" hidden></div>
<section id="produce"><h1>Produzir vídeo</h1><div class="layout"><form id="produceForm" class="card"><div class="pair"><label>Canal<select id="channel" required></select></label><label>Plataforma<select id="platform"><option>TikTok e YouTube Shorts</option><option>YouTube Shorts</option><option>TikTok</option></select></label></div>
<div class="pair"><label>Duração em segundos<input id="seconds" type="number" min="61" max="65" step="1" value="61" required></label><label>IA de roteiro e direção<select id="model" required></select></label></div>
<div class="pair"><label>Modelo de voz<select id="tts" required></select></label><label>Voz do ElevenLabs<select id="voice" required></select></label></div>
<fieldset><legend>Ideia do episódio</legend><div class="modes"><label><input type="radio" name="mode" value="mine" checked> Ideia própria</label><label><input type="radio" name="mode" value="assist"> Criar ideias</label></div>
<div id="mine"><label>Qual história você quer contar?<textarea id="idea" rows="3" maxlength="260" placeholder="Ex.: E se o Aquífero Guarani secasse em apenas 24 horas?"></textarea></label></div>
<div id="assist" hidden><button type="button" id="suggest">Sugerir 5 ideias</button><div id="ideas"></div></div></fieldset>
<button class="primary" id="generate">Gerar Vídeo 3D Automático <span>↗</span></button></form>
<aside><div class="poster" aria-label="Ilustração de uma sequência de animação por código"><div class="box b1"></div><div class="box b2"></div><div class="orb"></div><div class="rail"></div></div><div class="info"><h2>Estúdio 3D Automático</h2><p id="summary"></p><p id="ready"></p><button data-view="settings" class="link">Configurar conexões ↗</button></div></aside></div></section>
<section id="channels" hidden><h1>Canais</h1><div class="layout"><form class="card" id="channelForm"><h2 id="channelTitle">Novo canal</h2><label>Nome<input id="name" maxlength="70" required></label><label>Link do canal<input id="link" type="url" placeholder="https://…"></label><label>Descrição e público<textarea id="description" rows="3" maxlength="1100" required></textarea></label><label>Gancho dos vídeos<input id="hook" maxlength="350" placeholder="Ex.: E se…? Mostre a consequência no primeiro segundo."></label><label>Estilo visual<textarea id="style" rows="2" maxlength="500"></textarea></label><label>Direção da voz<input id="direction" maxlength="350"></label><label>Episódios já publicados fora do painel<textarea id="published" rows="2" placeholder="Um assunto por linha para incluir no histórico"></textarea></label><button class="primary">Salvar canal</button></form>
<div class="card"><h2>Meus canais</h2><div id="channelList"></div><button id="newChannel">Novo canal</button></div></div></section>
<section id="history" hidden><h1>Histórico</h1><label class="filter">Canal<select id="historyFilter"></select></label><div id="jobs" class="card"></div></section>
<section id="settings" hidden><h1>Configurações</h1><div class="settings"><form id="gatewayForm" class="card"><h2>Experiential Labs</h2><p>Modelos para ideias, roteiro e direção das cenas.</p><label>Chave de API<input id="gatewayKey" type="password" autocomplete="off" placeholder="xpl_…"></label><button class="primary">Conectar Experiential Labs</button><p id="gatewayStatus"></p></form>
<form id="elevenForm" class="card"><h2>ElevenLabs</h2><p>Narração em português brasileiro, com marcação de tempo.</p><label>Chave de API<input id="elevenKey" type="password" autocomplete="off"></label><button class="primary">Conectar ElevenLabs</button><p id="elevenStatus"></p></form></div></section>
</main><script src="/app.js"></script></body></html>
